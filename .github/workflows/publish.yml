name: Publish Extension

on:
  push:
    tags:
      - 'v*' # Triggers on tags starting with v (e.g., v1.0.0)
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    # Exposed at job level so steps can be skipped when a token isn't configured.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install Dependencies
        # --ignore-scripts: skips building "canvas", which only convert.js (icon tool) needs
        run: npm ci --ignore-scripts

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # Build the .vsix once so both registries receive the exact same file.
      # (vsce runs the "vscode:prepublish" script, which bundles with esbuild.)
      - name: Package Extension
        id: package
        run: npx --yes @vscode/vsce@3 package --out extension.vsix

      # Skipped when VSCE_PAT is not set; upload the .vsix artifact manually instead.
      - name: Publish to VS Code Marketplace
        id: marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce@3 publish --packagePath extension.vsix

      # Runs even if the Marketplace step failed, so one registry's outage
      # doesn't block the other.
      - name: Publish to Open VSX Registry
        if: ${{ !cancelled() && steps.package.outcome == 'success' && env.OVSX_PAT != '' }}
        run: npx --yes ovsx@0 publish extension.vsix

      - name: Upload .vsix artifact
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: extension.vsix
